[project]
name = "soi-gia-nha"
version = "0.1.0.dev0"
description = "Is this listing overpriced? Price check for Vietnamese real estate listings, with explanations."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "HongTin2104" }]
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "pyarrow>=15",
  "huggingface_hub>=0.24",
  "numpy>=1.26",
  "lightgbm>=4.3",
]

[project.optional-dependencies]
app = ["streamlit>=1.40", "plotly>=5.20"]
dev = ["pytest>=8", "ruff>=0.6", "streamlit>=1.40", "plotly>=5.20"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
